name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'madeleineostoja/pi-catppuccin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - name: Publish
        run: |
          package=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
            exit 0
          fi
          npm publish
